[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudpilot"
version = "0.1.0"
description = "Turns natural-language requests into reviewed AWS infrastructure deployments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "fastapi",
    "langgraph",
    # Concrete SQLite checkpointer for Task 012: the official LangGraph
    # package implementing BaseCheckpointSaver for SQLite. Hand-rolling the
    # checkpoint protocol (versioned tuples, msgpack serde, pending writes)
    # would duplicate a maintained implementation for no benefit.
    "langgraph-checkpoint-sqlite",
    "pydantic",
    "pydantic-settings",
    # ASGI server: FastAPI ships none, the container needs one, and Task
    # 010's API layer requires it regardless.
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    # Required by fastapi.testclient.TestClient (Task 006 and Task 010
    # API tests).
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests with no external dependencies",
    "integration: tests requiring external systems such as AWS",
]
filterwarnings = [
    "ignore:PNG rendering requires pygraphviz:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter owns line length; long docstrings and comments are not
# worth failing lint over.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cloudpilot"]

[tool.ruff.format]
# Black-compatible profile made explicit so intent survives review.
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
show_error_codes = true
# Enabled only once real errors appeared: plain strict mypy cannot see
# BaseSettings' runtime-validated __init__ (_env_file, model kwargs).
plugins = ["pydantic.mypy"]

# boto3/botocore ship no py.typed; they are treated as Any at the boundary.
# Scoped narrowly so it cannot mask our own packages.
[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*"]
ignore_missing_imports = true
